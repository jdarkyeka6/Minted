name: Ship Minted to TestFlight

on:
  workflow_dispatch:

concurrency:
  group: minted-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload iOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUNDLE_ID: com.jdarkyeka6.minted
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Check required Apple secrets
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=0
          for pair in \
            "APPLE_TEAM_ID:$APPLE_TEAM_ID" \
            "ASC_KEY_ID:$ASC_KEY_ID" \
            "ASC_ISSUER_ID:$ASC_ISSUER_ID" \
            "ASC_API_KEY_P8:$ASC_API_KEY_P8"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project
        env:
          CI: 1
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Show Xcode project details
        run: xcodebuild -workspace ios/Minted.xcworkspace -scheme Minted -showBuildSettings | head -n 80

      - name: Archive Minted
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/Minted.xcworkspace \
            -scheme Minted \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Minted.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Minted.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA_PATH=$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA was produced"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect / TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minted-ios-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: ignore

      - name: Done
        if: success()
        run: echo "Minted was uploaded to App Store Connect. It will appear in TestFlight after Apple finishes processing it."
