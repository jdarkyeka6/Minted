name: Ship Minted to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: minted-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload iOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUNDLE_ID: com.jdarkyeka6.minted
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Normalize and check Apple secrets
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail

          CLEAN_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')
          CLEAN_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          CLEAN_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')

          missing=0
          [ -n "$CLEAN_TEAM_ID" ] || { echo "::error::Missing GitHub Actions secret: APPLE_TEAM_ID"; missing=1; }
          [ -n "$CLEAN_KEY_ID" ] || { echo "::error::Missing GitHub Actions secret: ASC_KEY_ID"; missing=1; }
          [ -n "$CLEAN_ISSUER_ID" ] || { echo "::error::Missing GitHub Actions secret: ASC_ISSUER_ID"; missing=1; }
          [ -n "$ASC_API_KEY_P8" ] || { echo "::error::Missing GitHub Actions secret: ASC_API_KEY_P8"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

          if [ ${#CLEAN_TEAM_ID} -ne 10 ]; then
            echo "::error::APPLE_TEAM_ID should normally be 10 characters after whitespace is removed."
            exit 1
          fi

          echo "APPLE_TEAM_ID=$CLEAN_TEAM_ID" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$CLEAN_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$CLEAN_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project
        env:
          CI: 1
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Show Xcode project details
        run: xcodebuild -workspace ios/Minted.xcworkspace -scheme Minted -showBuildSettings | head -n 80

      - name: Archive Minted without development signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          export NODE_BINARY="$(command -v node)"
          echo "Using Node: $NODE_BINARY ($(node --version))"
          xcodebuild \
            -workspace ios/Minted.xcworkspace \
            -scheme Minted \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Minted.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "$PWD/build/xcode-archive.log"

      - name: Create export options
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export and sign IPA for App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Minted.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA_PATH=$(find "$PWD/build/export" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA was produced"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect / TestFlight
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minted-build-${{ github.run_number }}
          path: |
            build/xcode-archive.log
            build/export/*.ipa
          if-no-files-found: warn

      - name: Done
        if: success()
        run: echo "Minted was uploaded to App Store Connect. It will appear in TestFlight after Apple finishes processing it."
