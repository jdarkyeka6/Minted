name: Validate Minted Native iOS

on:
  push:
    branches:
      - minted-overhaul
  workflow_dispatch:

concurrency:
  group: minted-native-overhaul
  cancel-in-progress: true

jobs:
  native-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.jdarkyeka6.minted
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate native iOS project
        env:
          CI: 1
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Verify Xcode and SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "::error::Expected iOS 26 SDK, got $SDK_VERSION"; exit 1 ;;
          esac

      - name: Archive without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          export NODE_BINARY="$(command -v node)"
          xcodebuild \
            -workspace ios/Minted.xcworkspace \
            -scheme Minted \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Minted.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "$PWD/build/native-archive.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minted-native-overhaul-${{ github.run_number }}
          path: build/native-archive.log
          if-no-files-found: warn
